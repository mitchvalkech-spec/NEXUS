<script>
    const ADMIN_EMAIL = "aristideotoghe@gmail.com";

    /*
     * Garde ta clé API comme tu l'as actuellement configurée.
     * Je ne modifie pas cette partie dans cette correction.
     */
    const POLLINATIONS_API_KEY = "sk_BmAEWYalAvtU0h97xukfKG6UdWnuGeox";

    let utilisateurActif = null;
    let categorieCourante = "Conversation directe";

    // Historique de la conversation actuelle
    let historiqueConversation = [];

    const SYSTEM_PROMPT = `
Tu es NEXUS, une intelligence artificielle conçue pour aider les utilisateurs
à comprendre leurs problèmes et à trouver des solutions.

Ton créateur est Otoghe nzé Aristide.

Si on te demande qui t’a créé, réponds :

Ne prétends pas avoir été créé par OpenAI.

Tu aides dans :

Méthode :

Sois clair, utile, respectueux et encourageant.

// ======================================================
// INITIALISATION
// ======================================================

window.onload = function () {

    const sessionEmail =
        localStorage.getItem("nexus_session_email");

    if (sessionEmail) {

        const utilisateurs =
            JSON.parse(
                localStorage.getItem("nexus_users_db") || "[]"
            );

        const trouve =
            utilisateurs.find(
                u => u.email === sessionEmail
            );

        if (trouve) {

            utilisateurActif = trouve;

            chargerInterfaceApp();
        }
    }

    // Permet d'envoyer avec Ctrl + Entrée
    const chatInput =
        document.getElementById("chat-input");

    if (chatInput) {

        chatInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter" && event.ctrlKey) {

                event.preventDefault();

                envoyerMessage();
            }
        });
    }
};


// ======================================================
// AUTHENTIFICATION
// ======================================================

function basculerAuth(mode) {

    const login =
        document.getElementById("login-form-container");

    const register =
        document.getElementById("register-form-container");

    if (mode === "register") {

        login.style.display = "none";
        register.style.display = "block";

    } else {

        register.style.display = "none";
        login.style.display = "block";
    }
}


// ======================================================
// INSCRIPTION
// ======================================================

function gererInscription() {

    const nom =
        document.getElementById("reg-name").value.trim();

    const email =
        document.getElementById("reg-email")
        .value.trim()
        .toLowerCase();

    const pays =
        document.getElementById("reg-country")
        .value.trim();

    const password =
        document.getElementById("reg-password").value;

    const confirm =
        document.getElementById("reg-confirm").value;


    if (!nom || !email || !pays || !password || !confirm) {

        alert("Veuillez remplir tous les champs.");

        return;
    }


    if (password !== confirm) {

        alert("Les mots de passe ne correspondent pas.");

        return;
    }


    let utilisateurs =
        JSON.parse(
            localStorage.getItem("nexus_users_db") || "[]"
        );


    if (utilisateurs.some(u => u.email === email)) {

        alert("Cet e-mail est déjà associé à un compte.");

        return;
    }


    const nouvelUtilisateur = {

        nom: nom,
        email: email,
        pays: pays,
        password: password,

        role:
            email === ADMIN_EMAIL
                ? "Admin"
                : "Utilisateur"
    };


    utilisateurs.push(nouvelUtilisateur);


    localStorage.setItem(
        "nexus_users_db",
        JSON.stringify(utilisateurs)
    );


    alert("Inscription réussie ! Vous pouvez vous connecter.");

    // Nettoyage des champs
    document.getElementById("reg-name").value = "";
    document.getElementById("reg-email").value = "";
    document.getElementById("reg-country").value = "";
    document.getElementById("reg-password").value = "";
    document.getElementById("reg-confirm").value = "";

    basculerAuth("login");
}


// ======================================================
// CONNEXION
// ======================================================

function gererConnexion() {

    const email =
        document.getElementById("login-email")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("login-password").value;


    if (!email || !password) {

        alert("Veuillez remplir tous les champs.");

        return;
    }


    const utilisateurs =
        JSON.parse(
            localStorage.getItem("nexus_users_db") || "[]"
        );


    const utilisateur =
        utilisateurs.find(
            u =>
                u.email === email &&
                u.password === password
        );


    if (!utilisateur) {

        alert("E-mail ou mot de passe incorrect.");

        return;
    }


    utilisateurActif = utilisateur;


    localStorage.setItem(
        "nexus_session_email",
        utilisateur.email
    );


    // Nouvelle conversation à la connexion
    historiqueConversation = [];


    chargerInterfaceApp();
}


// ======================================================
// DÉCONNEXION
// ======================================================

function deconnexion() {

    localStorage.removeItem(
        "nexus_session_email"
    );

    utilisateurActif = null;

    historiqueConversation = [];


    document.getElementById("app-section")
        .style.display = "none";

    document.getElementById("auth-section")
        .style.display = "block";


    // Nettoyage du chat
    const chat =
        document.getElementById("chat-container");

    if (chat) {

        chat.innerHTML = `
            <div class="message assistant">
                Bonjour ! Je suis NEXUS, créé par Otoghe nzé Aristide.
                Comment puis-je t'aider aujourd'hui ?
            </div>
        `;
    }
}


// ======================================================
// CHARGEMENT DE L'APPLICATION
// ======================================================

function chargerInterfaceApp() {

    if (!utilisateurActif) {
        return;
    }


    document.getElementById("auth-section")
        .style.display = "none";

    document.getElementById("app-section")
        .style.display = "block";


    document.getElementById("user-welcome-text")
        .textContent =
        `Bienvenue, ${utilisateurActif.nom}`;


    document.getElementById("user-country-display")
        .textContent =
        `Pays : ${utilisateurActif.pays} | Rôle : ${utilisateurActif.role}`;


    if (utilisateurActif.email === ADMIN_EMAIL) {

        document.getElementById("admin-panel")
            .style.display = "block";

        chargerAdmin();

    } else {

        document.getElementById("admin-panel")
            .style.display = "none";
    }
}


// ======================================================
// ADMINISTRATION
// ======================================================

function chargerAdmin() {

    const tbody =
        document.getElementById("admin-users-tbody");

    if (!tbody) {
        return;
    }


    tbody.innerHTML = "";


    const utilisateurs =
        JSON.parse(
            localStorage.getItem("nexus_users_db") || "[]"
        );


    utilisateurs.forEach((u, i) => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `
            <td style="padding:0.5rem;">
                ${echapperHTML(u.nom)}
            </td>

            <td style="padding:0.5rem;">
                ${echapperHTML(u.email)}
            </td>

            <td style="padding:0.5rem;">
                ${echapperHTML(u.pays)}
            </td>

            <td style="padding:0.5rem;">
                ${echapperHTML(u.role)}
            </td>

            <td style="padding:0.5rem;">
                ${
                    u.email !== ADMIN_EMAIL
                        ? `
                            <button
                                onclick="supprimerUser(${i})"
                                class="btn-danger"
                                style="padding:0.2rem 0.5rem;font-size:0.75rem;">
                                X
                            </button>
                          `
                        : "Protégé"
                }
            </td>
        `;


        tbody.appendChild(tr);
    });
}


// ======================================================
// SUPPRIMER UTILISATEUR
// ======================================================

function supprimerUser(i) {

    let utilisateurs =
        JSON.parse(
            localStorage.getItem("nexus_users_db") || "[]"
        );


    if (!utilisateurs[i]) {
        return;
    }


    if (utilisateurs[i].email === ADMIN_EMAIL) {

        alert("Le compte administrateur est protégé.");

        return;
    }


    utilisateurs.splice(i, 1);


    localStorage.setItem(
        "nexus_users_db",
        JSON.stringify(utilisateurs)
    );


    chargerAdmin();
}


// ======================================================
// CATÉGORIES
// ======================================================

function selectionnerCategorie(cat, el) {

    categorieCourante = cat;


    document
        .querySelectorAll(".category-btn")
        .forEach(button => {

            button.classList.remove("active");
        });


    if (el) {
        el.classList.add("active");
    }


    // On informe visuellement l'utilisateur
    ajouterMsg(
        `Domaine sélectionné : ${cat}`,
        "assistant"
    );
}


// ======================================================
// AJOUTER UN MESSAGE AU CHAT
// ======================================================

function ajouterMsg(texte, type, id = null) {

    const chat =
        document.getElementById("chat-container");


    if (!chat) {
        return null;
    }


    const message =
        document.createElement("div");


    message.className =
        `message ${type}`;


    if (id) {
        message.id = id;
    }


    message.textContent = texte;


    chat.appendChild(message);


    // Descendre automatiquement en bas
    chat.scrollTop = chat.scrollHeight;


    return message;
}


// ======================================================
// ENVOYER UN MESSAGE À NEXUS
// ======================================================

async function envoyerMessage() {

    const input =
        document.getElementById("chat-input");


    if (!input) {
        return;
    }


    const texte =
        input.value.trim();


    if (!texte) {
        return;
    }


    if (!utilisateurActif) {

        ajouterMsg(
            "Veuillez vous connecter avant d'utiliser NEXUS.",
            "assistant"
        );

        return;
    }


    // Message utilisateur
    ajouterMsg(texte, "user");


    // Nettoyage du champ
    input.value = "";


    // Message temporaire
    const loadId =
        "load-" + Date.now();


    ajouterMsg(
        "NEXUS réfléchit...",
        "assistant",
        loadId
    );


    // Ajouter la question à l'historique
    historiqueConversation.push({

        role: "user",

        content: texte
    });


    try {

        // Vérification basique de la clé
        if (
            typeof POLLINATIONS_API_KEY === "undefined" ||
            !POLLINATIONS_API_KEY
        ) {

            throw new Error(
                "La clé API NEXUS n'est pas configurée."
            );
        }


        // Construire le contexte système
        const contexteSysteme = `
${SYSTEM_PROMPT}

Informations sur l'utilisateur :
Nom : ${utilisateurActif.nom}
Pays : ${utilisateurActif.pays}
Domaine actuel : ${categorieCourante}
`;


        /*
         * On envoie l'historique afin que NEXUS
         * puisse conserver le contexte de la conversation.
         */
        const messages = [

            {
                role: "system",
                content: contexteSysteme
            },

            ...historiqueConversation
        ];


        const res =
            await fetch(
                "https://gen.pollinations.ai/v1/chat/completions",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${POLLINATIONS_API_KEY}`
                    },

                    body: JSON.stringify({

                        model:
                            "openai/gpt-5.6-luna",

                        messages: messages,

                        temperature: 0.7
                    })
                }
            );


        // Vérification HTTP
        if (!res.ok) {

            let details = "";

            try {

                details =
                    await res.text();

            } catch (e) {

                details = "";
            }


            throw new Error(
                `Erreur API (${res.status}) ${details}`
            );
        }


        // Conversion JSON
        const data =
            await res.json();


        /*
         * Vérification de la structure de réponse
         */
        const reponse =
            data?.choices?.[0]?.message?.content;


        if (
            !reponse ||
            typeof reponse !== "string"
        ) {

            throw new Error(
                "L'API a renvoyé une réponse vide ou invalide."
            );
        }


        // Supprimer "NEXUS réfléchit..."
        const loader =
            document.getElementById(loadId);

        if (loader) {
            loader.remove();
        }


        // Ajouter la réponse à l'historique
        historiqueConversation.push({

            role: "assistant",

            content: reponse
        });


        // Afficher la réponse
        ajouterMsg(
            reponse,
            "assistant"
        );


    } catch (erreur) {

        console.error(
            "Erreur NEXUS :",
            erreur
        );


        // Supprimer le message de chargement
        const loader =
            document.getElementById(loadId);

        if (loader) {
            loader.remove();
        }


        /*
         * Retirer le dernier message utilisateur
         * de l'historique si l'appel a échoué.
         */
        if (
            historiqueConversation.length > 0 &&
            historiqueConversation[
                historiqueConversation.length - 1
            ].role === "user"
        ) {

            historiqueConversation.pop();
        }


        let messageErreur =
            "Une erreur s'est produite pendant la communication avec NEXUS.";


        if (
            erreur &&
            erreur.message
        ) {

            messageErreur +=
                `\n\nDétail : ${erreur.message}`;
        }


        ajouterMsg(
            messageErreur,
            "assistant"
        );
    }
}


// ======================================================
// MICRO
// ======================================================

let reconnaissanceVocale = null;
let microActif = false;


function alternerMicro() {

    const bouton =
        document.getElementById("mic-btn");


    // Vérifier la disponibilité
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "La reconnaissance vocale n'est pas disponible dans ce navigateur."
        );

        return;
    }


    // Si le micro est déjà actif
    if (microActif) {

        if (reconnaissanceVocale) {
            reconnaissanceVocale.stop();
        }

        return;
    }


    reconnaissanceVocale =
        new SpeechRecognition();


    reconnaissanceVocale.lang = "fr-FR";

    reconnaissanceVocale.continuous = false;

    reconnaissanceVocale.interimResults = false;


    reconnaissanceVocale.onstart = function () {

        microActif = true;

        if (bouton) {

            bouton.classList.add("listening");

            bouton.title =
                "Arrêter le micro";
        }
    };


    reconnaissanceVocale.onresult =
        function (event) {

            const resultat =
                event.results?.[0]?.[0]?.transcript;


            if (resultat) {

                const input =
                    document.getElementById("chat-input");


                if (input) {

                    input.value =
                        resultat;
                }
            }
        };


    reconnaissanceVocale.onerror =
        function (event) {

            console.error(
                "Erreur micro :",
                event.error
            );
        };


    reconnaissanceVocale.onend =
        function () {

            microActif = false;


            if (bouton) {

                bouton.classList.remove(
                    "listening"
                );

                bouton.title =
                    "Activer le micro";
            }
        };


    reconnaissanceVocale.start();
}


// ======================================================
// ÉCHAPPEMENT HTML
// ======================================================

function echapperHTML(texte) {

    return String(texte)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
