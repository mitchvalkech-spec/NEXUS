<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS - Assistant IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #27304a;
      background: #11182d;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      color: #aeb8d0;
    }

    .home {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .home-card {
      width: 100%;
      max-width: 600px;
      text-align: center;
      background: #11182d;
      border: 1px solid #27304a;
      border-radius: 20px;
      padding: 35px;
    }

    .home-card h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .home-card p {
      color: #b8c1d8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .primary-btn {
      border: none;
      background: #4169e1;
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .chat-page {
      display: none;
      flex-direction: column;
      height: calc(100vh - 85px);
    }

    .chat-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #27304a;
      background: #11182d;
    }

    .chat-header h2 {
      font-size: 20px;
    }

    .small-btn {
      border: 1px solid #3a4665;
      background: #18213a;
      color: white;
      padding: 9px 12px;
      border-radius: 9px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 15px;
      margin-bottom: 14px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-message {
      margin-left: auto;
      background: #4169e1;
    }

    .ai-message {
      margin-right: auto;
      background: #18213a;
      border: 1px solid #27304a;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #27304a;
      background: #11182d;
    }

    #messageInput {
      flex: 1;
      resize: none;
      min-height: 50px;
      max-height: 140px;
      border: 1px solid #34405d;
      border-radius: 12px;
      background: #0b1020;
      color: white;
      padding: 14px;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      background: #4169e1;
      color: white;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: bold;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #9da8c0;
      font-size: 13px;
      padding: 6px;
    }

    @media (max-width: 600px) {
      .home {
        padding: 15px;
      }

      .home-card {
        padding: 25px 18px;
      }

      .message {
        max-width: 92%;
      }

      .input-area {
        padding: 10px;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <h1>NEXUS</h1>
      <p>Ton assistant IA pédagogique</p>
    </header>

    <section class="home" id="homePage">
      <div class="home-card">

        <h2>Bienvenue sur NEXUS</h2>

        <p>
          NEXUS est ton assistant intelligent pour t'aider
          à comprendre les mathématiques, la physique-chimie
          et bien d'autres matières.
        </p>

        <button class="primary-btn" id="startButton">
          Commencer une conversation
        </button>

      </div>
    </section>


    <section class="chat-page" id="chatPage">

      <div class="chat-header">

        <h2>NEXUS IA</h2>

        <button class="small-btn" id="changeKeyButton">
          Modifier la clé
        </button>

      </div>

      <div class="messages" id="messages"></div>

      <div class="status" id="status">
        NEXUS est prêt.
      </div>

      <div class="input-area">

        <textarea
          id="messageInput"
          placeholder="Écris ton exercice ou ta question..."
        ></textarea>

        <button id="sendButton">
          Envoyer
        </button>

      </div>

    </section>

  </div>


  <script>

    // ======================================================
    // CONFIGURATION DE NEXUS
    // ======================================================

    const API_URL =
      "https://gen.pollinations.ai/v1/chat/completions";

    const AI_MODEL =
      "openai/gpt-5.6-luna";


    // ======================================================
    // 🔴🔴🔴 CLÉ API NEXUS
    // ======================================================
    //
    // COLLE TA NOUVELLE CLÉ ENTRE LES GUILLEMETS CI-DESSOUS.
    //
    // ======================================================

    const POLLINATIONS_API_KEY =
  sk_BmAEWYalAvtU0h97xukfKG6UdWnuGeox;


    // ======================================================
    // VARIABLES
    // ======================================================

    let chatHistory = [];

    const homePage =
      document.getElementById("homePage");

    const chatPage =
      document.getElementById("chatPage");

    const startButton =
      document.getElementById("startButton");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const status =
      document.getElementById("status");

    const changeKeyButton =
      document.getElementById("changeKeyButton");


    // ======================================================
    // OUVRIR LE CHAT
    // ======================================================

    startButton.addEventListener("click", function() {

      homePage.style.display = "none";

      chatPage.style.display = "flex";

      if (chatHistory.length === 0) {

        addAIMessage(
          "Bonjour ! Je suis NEXUS. 👋\n\n" +
          "Envoie-moi ton exercice de mathématiques, " +
          "de physique-chimie ou ta question."
        );

      }

      messageInput.focus();

    });


    // ======================================================
    // RÉCUPÉRER LA CLÉ API
    // ======================================================

    function getApiKey() {

      return POLLINATIONS_API_KEY.trim();

    }


    // ======================================================
    // BOUTON MODIFIER LA CLÉ
    // ======================================================

    changeKeyButton.addEventListener("click", function() {

      const nouvelleCle =
        prompt(
          "Colle ta nouvelle clé API Pollinations :"
        );

      if (
        nouvelleCle &&
        nouvelleCle.trim() !== ""
      ) {

        alert(
          "Pour modifier définitivement la clé, " +
          "remplace-la dans le code à l'endroit " +
          "indiqué 🔴."
        );

      }

    });


    // ======================================================
    // AFFICHER MESSAGE UTILISATEUR
    // ======================================================

    function addUserMessage(text) {

      const message =
        document.createElement("div");

      message.className =
        "message user-message";

      message.textContent =
        text;

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

    }


    // ======================================================
    // AFFICHER MESSAGE NEXUS
    // ======================================================

    function addAIMessage(text) {

      const message =
        document.createElement("div");

      message.className =
        "message ai-message";

      message.textContent =
        text;

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

    }


    // ======================================================
    // ENVOYER LE MESSAGE
    // ======================================================

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) {

        return;

      }


      const apiKey =
        getApiKey();


      if (!apiKey ||
          apiKey === "COLLE_TA_NOUVELLE_CLÉ_ICI") {

        addAIMessage(
          "⚠️ La clé API NEXUS n'est pas encore configurée.\n\n" +
          "Ouvre le code et colle ta clé dans la ligne " +
          "marquée 🔴."
        );

        return;

      }


      addUserMessage(text);

      messageInput.value = "";

      sendButton.disabled = true;

      messageInput.disabled = true;

      status.textContent =
        "NEXUS réfléchit...";


      chatHistory.push({

        role: "user",

        content: text

      });


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + apiKey

              },

              body: JSON.stringify({

                model: AI_MODEL,

                messages: [

                  {
                    role: "system",

                    content:
                      "Tu es NEXUS, un assistant " +
                      "pédagogique intelligent. " +
                      "Tu aides principalement les élèves " +
                      "en mathématiques, physique-chimie " +
                      "et sciences. " +
                      "Explique les réponses étape par étape " +
                      "avec des mots simples. " +
                      "Ne donne pas seulement la réponse : " +
                      "aide l'élève à comprendre."
                  },

                  ...chatHistory

                ],

                temperature: 0.7

              })

            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            "Erreur API " +
            response.status +
            " : " +
            errorText
          );

        }


        const data =
          await response.json();


        const aiText =
          data?.choices?.[0]?.message?.content;


        if (!aiText) {

          throw new Error(
            "La réponse de l'API est vide."
          );

        }


        chatHistory.push({

          role: "assistant",

          content: aiText

        });


        addAIMessage(aiText);

        status.textContent =
          "NEXUS est prêt.";

      }

      catch (error) {

        console.error(
          "Erreur NEXUS :",
          error
        );

        addAIMessage(
          "❌ NEXUS n'a pas pu obtenir de réponse.\n\n" +
          "Vérifie ta clé API et ta connexion Internet."
        );

        status.textContent =
          "Erreur de connexion.";

      }

      finally {

        sendButton.disabled = false;

        messageInput.disabled = false;

        messageInput.focus();

      }

    }


    // ======================================================
    // BOUTON ENVOYER
    // ======================================================

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    // ======================================================
    // TOUCHE ENTRÉE
    // ======================================================

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
