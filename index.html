<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXUS - Assistant IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    /* ACCUEIL */

    #home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .logo {
      font-size: 55px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #b8c0d9;
      font-size: 18px;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .start-btn {
      background: #5865f2;
      color: white;
      padding: 16px 30px;
      border-radius: 12px;
      font-weight: bold;
    }

    .start-btn:hover {
      background: #4752c4;
    }

    /* CHAT */

    #chatPage {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      background: #11182d;
      border-bottom: 1px solid #29324d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .topbar h1 {
      font-size: 24px;
    }

    .back-btn {
      background: #252d46;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: auto;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      margin-bottom: 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 14px 17px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #5865f2;
    }

    .ai .bubble {
      background: #1b243d;
    }

    .input-area {
      padding: 20px;
      border-top: 1px solid #29324d;
      display: flex;
      gap: 10px;
      background: #11182d;
    }

    #messageInput {
      flex: 1;
      resize: none;
      min-height: 55px;
      max-height: 150px;
      border: 1px solid #35405e;
      background: #0d1427;
      color: white;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #5865f2;
    }

    #sendBtn {
      background: #5865f2;
      color: white;
      padding: 0 22px;
      border-radius: 12px;
      font-weight: bold;
    }

    #sendBtn:hover {
      background: #4752c4;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .logo {
        font-size: 42px;
      }

      .subtitle {
        font-size: 16px;
      }

      .bubble {
        max-width: 88%;
      }

      .input-area {
        padding: 10px;
      }

      #sendBtn {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <!-- PAGE D'ACCUEIL -->

  <section id="home">

    <div class="logo">
      NEXUS
    </div>

    <p class="subtitle">
      Ton assistant intelligent pour apprendre,
      résoudre des exercices de mathématiques
      et comprendre la physique-chimie.
    </p>

    <button class="start-btn" id="startBtn">
      Commencer une conversation
    </button>

  </section>


  <!-- PAGE CHAT -->

  <section id="chatPage">

    <div class="topbar">

      <h1>NEXUS</h1>

      <button class="back-btn" id="backBtn">
        Accueil
      </button>

    </div>


    <div class="chat-container">

      <div id="messages">

        <div class="message ai">

          <div class="bubble">
            Bonjour ! Je suis NEXUS. 👋

            Pour l'instant, je suis en mode test.
            Écris-moi quelque chose pour vérifier que le chat fonctionne.
          </div>

        </div>

      </div>


      <div class="input-area">

        <textarea
          id="messageInput"
          placeholder="Écris ton message..."
        ></textarea>

        <button id="sendBtn">
          Envoyer
        </button>

      </div>

    </div>

  </section>


  <script>

    /*
      NEXUS - VERSION TEST

      Cette version ne nécessite aucune API.
      Elle sert uniquement à vérifier que
      les boutons et le JavaScript fonctionnent.
    */


    const home = document.getElementById("home");
    const chatPage = document.getElementById("chatPage");

    const startBtn = document.getElementById("startBtn");
    const backBtn = document.getElementById("backBtn");

    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");


    /*
      OUVRIR LE CHAT
    */

    startBtn.addEventListener("click", function () {

      home.style.display = "none";

      chatPage.style.display = "flex";

      messageInput.focus();

    });


    /*
      RETOUR À L'ACCUEIL
    */

    backBtn.addEventListener("click", function () {

      chatPage.style.display = "none";

      home.style.display = "flex";

    });


    /*
      AJOUTER UN MESSAGE
    */

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;


      const bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;


      message.appendChild(bubble);

      messages.appendChild(message);


      messages.scrollTop = messages.scrollHeight;

    }


    /*
      RÉPONSE DE TEST DE NEXUS
    */

    function nexusResponse(userText) {

      const text = userText.toLowerCase();


      if (text.includes("bonjour") ||
          text.includes("salut") ||
          text.includes("hello")) {

        return "Bonjour ! 👋 Je suis NEXUS. Je fonctionne correctement.";

      }


      if (text.includes("math")) {

        return "Les mathématiques seront bientôt intégrées à mon intelligence. Pour l'instant, le système de conversation fonctionne.";

      }


      if (text.includes("physique")) {

        return "Le module de physique-chimie sera ajouté dans la prochaine étape.";

      }


      if (text.includes("qui es tu") ||
          text.includes("qui es-tu")) {

        return "Je suis NEXUS, ton futur assistant intelligent.";

      }


      return "J'ai bien reçu ton message : \"" +
             userText +
             "\"\n\nLe système de chat fonctionne ! La prochaine étape sera de connecter la véritable intelligence de NEXUS.";

    }


    /*
      ENVOYER UN MESSAGE
    */

    function sendMessage() {

      const text = messageInput.value.trim();


      if (text === "") {

        return;

      }


      addMessage(text, "user");


      messageInput.value = "";


      sendBtn.disabled = true;


      setTimeout(function () {

        const response = nexusResponse(text);

        addMessage(response, "ai");

        sendBtn.disabled = false;

        messageInput.focus();

      }, 500);

    }


    /*
      BOUTON ENVOYER
    */

    sendBtn.addEventListener("click", function () {

      sendMessage();

    });


    /*
      ENVOYER AVEC LA TOUCHE ENTRÉE
    */

    messageInput.addEventListener("keydown", function (event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    });


  </script>

</body>
</html>
