<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050812;
      color: #ffffff;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #8d98ad;
      font-size: 12px;
      margin-top: 5px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #28d8ca;
      color: #041015;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .page {
      display: none;
      padding: 0 18px;
    }

    .page.active {
      display: block;
    }

    .hero {
      padding: 26px;
      border-radius: 25px;
      background: linear-gradient(145deg, #121c35, #09101f);
      border: 1px solid #1d2b49;
      margin-bottom: 28px;
    }

    .tag {
      color: #43ded1;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .hero p {
      color: #9aa6bb;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .primary {
      border: none;
      background: #40ddd1;
      color: #041014;
      padding: 13px 19px;
      border-radius: 12px;
      font-weight: bold;
    }

    .title {
      font-size: 19px;
      margin-bottom: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #0e1729;
      border: 1px solid #1b2944;
      border-radius: 18px;
      padding: 19px 15px;
      min-height: 135px;
    }

    .icon {
      font-size: 25px;
      margin-bottom: 14px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .card p {
      color: #8995aa;
      font-size: 12px;
      line-height: 1.5;
    }

    .section-box {
      background: #0e1729;
      border: 1px solid #1b2944;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .section-box h2 {
      margin-bottom: 9px;
      font-size: 20px;
    }

    .section-box p {
      color: #96a1b5;
      line-height: 1.6;
      font-size: 14px;
    }

    .chat {
      height: 55vh;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .message {
      padding: 13px 15px;
      border-radius: 15px;
      margin-bottom: 10px;
      max-width: 88%;
      line-height: 1.5;
      font-size: 14px;
    }

    .bot {
      background: #111c31;
      border: 1px solid #1e2c49;
    }

    .user {
      background: #28cfc3;
      color: #031012;
      margin-left: auto;
    }

    .chat-input {
      display: flex;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid #263653;
      background: #0b1323;
      color: white;
      outline: none;
    }

    .chat-input button {
      width: 48px;
      border: none;
      border-radius: 13px;
      background: #40ddd1;
      font-size: 19px;
    }

    .empty {
      text-align: center;
      color: #8b96aa;
      padding: 45px 10px;
    }

    nav {
      position: fixed;
      z-index: 20;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 100%);
      background: rgba(7, 12, 24, 0.97);
      border-top: 1px solid #1a2740;
      display: flex;
      justify-content: space-around;
      padding: 10px 3px;
    }

    nav button {
      background: none;
      border: none;
      color: #7f8ba1;
      font-size: 10px;
      padding: 4px 8px;
    }

    nav button span {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }

    nav button.active {
      color: #45ded2;
    }

    @media (max-width: 360px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
